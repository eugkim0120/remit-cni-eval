[project]
name = "remit-cni-eval"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "scipy>=1.17.1",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["remit_cni", "remit_cni.sandbox", "remit_cni.scenarios", "remit_cni.coding"]
